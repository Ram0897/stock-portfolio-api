services:
  postgres:
    image: postgres:16-alpine
    container_name: stock-portfolio-postgres
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: stock-portfolio-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/portfolio
      DB_USERNAME: portfolio
      DB_PASSWORD: portfolio
    ports:
      - "8080:8080"

volumes:
  postgres_data:
